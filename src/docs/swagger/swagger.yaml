basePath: /v1/api
definitions:
  agents.agentCreateRequest:
    description: Request body for creating a new agent
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      description:
        type: string
      model:
        type: string
      name:
        type: string
      system_prompt:
        type: string
      version:
        type: string
    type: object
  agents.agentListResponse:
    description: Paginated list of agents
    properties:
      data:
        items:
          $ref: '#/definitions/agents.agentResponse'
        type: array
      pagination:
        $ref: '#/definitions/handlers.Pagination'
    type: object
  agents.agentResponse:
    description: Agent resource returned by create, get, and update operations
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      crc64:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      model:
        type: string
      name:
        type: string
      system_prompt:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  agents.agentUpdateRequest:
    description: Request body for updating an existing agent
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      description:
        type: string
      model:
        type: string
      name:
        type: string
      system_prompt:
        type: string
      version:
        type: string
    type: object
  handlers.FieldError:
    description: Field-level validation error returned inside a ProblemDetail
    properties:
      code:
        enum:
        - REQUIRED
        - MAX_LENGTH
        - MAX_ITEMS
        - TOO_LARGE
        - INVALID_FORMAT
        - INVALID_VALUE
        example: REQUIRED
        type: string
      field:
        example: name
        type: string
      message:
        example: name is required
        type: string
    type: object
  handlers.Pagination:
    description: Cursor-based pagination metadata returned with list responses
    properties:
      cursor:
        example: dGVzdA==
        type: string
      has_more:
        example: false
        type: boolean
      limit:
        example: 100
        type: integer
      next_cursor:
        example: dGVzdA==
        type: string
    type: object
  handlers.ProblemDetail:
    description: RFC 7807 Problem Details error response
    properties:
      detail:
        example: agent not found
        type: string
      errors:
        items:
          $ref: '#/definitions/handlers.FieldError'
        type: array
      instance:
        example: /v1/api/agents/my-agent
        type: string
      status:
        example: 404
        type: integer
      title:
        example: Not Found
        type: string
      traceId:
        example: trace-abc123
        type: string
      type:
        example: https://mnemonic.example.com/problems/not-found
        type: string
    type: object
  patterns.associationRequest:
    description: Agent association entry used in pattern create and update requests
    properties:
      agent_name:
        type: string
      relevance:
        type: number
    required:
    - agent_name
    type: object
  patterns.associationResponse:
    description: Agent association returned in pattern responses
    properties:
      agent_name:
        type: string
      relevance:
        type: number
    type: object
  patterns.associationsRequest:
    description: Request body for setting agent associations on a pattern
    properties:
      associations:
        items:
          $ref: '#/definitions/patterns.associationRequest'
        type: array
    required:
    - associations
    type: object
  patterns.associationsResponse:
    description: Response body containing the current agent associations for a pattern
    properties:
      associations:
        items:
          $ref: '#/definitions/patterns.associationResponse'
        type: array
    type: object
  patterns.chunkListResponse:
    description: List of chunk summaries for a pattern
    properties:
      chunks:
        items:
          $ref: '#/definitions/patterns.chunkSummary'
        type: array
      count:
        type: integer
    type: object
  patterns.chunkSummary:
    description: Summary of a single content chunk belonging to a pattern
    properties:
      chunk_index:
        type: integer
      enrichment_status:
        type: string
      section_title:
        type: string
    type: object
  patterns.conceptResponse:
    description: Concept node returned in graph context
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  patterns.graphContextResponse:
    description: Graph context containing related patterns and concepts
    properties:
      concepts:
        items:
          $ref: '#/definitions/patterns.conceptResponse'
        type: array
      related_patterns:
        items:
          $ref: '#/definitions/patterns.relatedPatternResponse'
        type: array
    type: object
  patterns.patternCreateRequest:
    description: Request body for creating a new pattern
    properties:
      agent_associations:
        items:
          $ref: '#/definitions/patterns.associationRequest'
        type: array
      content:
        type: string
      description:
        type: string
      domain:
        type: string
      entity_type:
        type: string
      language:
        type: string
      name:
        type: string
      related_patterns:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  patterns.patternListResponse:
    description: Paginated list of pattern summaries
    properties:
      data:
        items:
          $ref: '#/definitions/patterns.patternSummaryResponse'
        type: array
      pagination:
        $ref: '#/definitions/handlers.Pagination'
    type: object
  patterns.patternResponse:
    description: Full pattern resource returned by create, get, and update operations
    properties:
      agent_associations:
        items:
          $ref: '#/definitions/patterns.associationResponse'
        type: array
      chunks:
        items:
          $ref: '#/definitions/patterns.chunkSummary'
        type: array
      content:
        type: string
      created_at:
        type: string
      description:
        type: string
      domain:
        type: string
      enriched_at:
        type: string
      enrichment_error:
        type: string
      enrichment_status:
        type: string
      entity_type:
        type: string
      graph:
        $ref: '#/definitions/patterns.graphContextResponse'
      id:
        type: string
      language:
        type: string
      name:
        type: string
      related_patterns:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
      version:
        type: string
    type: object
  patterns.patternSummaryResponse:
    description: Abbreviated pattern resource returned in list responses
    properties:
      created_at:
        type: string
      description:
        type: string
      enrichment_status:
        type: string
      id:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  patterns.patternUpdateRequest:
    description: Request body for updating an existing pattern
    properties:
      agent_associations:
        items:
          $ref: '#/definitions/patterns.associationRequest'
        type: array
      content:
        type: string
      description:
        type: string
      domain:
        type: string
      entity_type:
        type: string
      language:
        type: string
      name:
        type: string
      related_patterns:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  patterns.relatedPatternResponse:
    description: Related pattern entry returned in graph context
    properties:
      id:
        type: string
      name:
        type: string
      relationship:
        type: string
      strength:
        type: number
    type: object
  patterns.searchMetadata:
    description: Metadata returned alongside semantic search results
    properties:
      query:
        type: string
      search_duration_ms:
        type: integer
      total_candidates:
        type: integer
    type: object
  patterns.searchResponse:
    description: Response body for a semantic pattern search operation
    properties:
      metadata:
        $ref: '#/definitions/patterns.searchMetadata'
      results:
        items:
          $ref: '#/definitions/patterns.searchResultResponse'
        type: array
    type: object
  patterns.searchResultResponse:
    description: Single semantic search result matching a query
    properties:
      chunk_index:
        type: integer
      content:
        type: string
      domain:
        type: string
      entity_type:
        type: string
      language:
        type: string
      pattern_id:
        type: string
      pattern_name:
        type: string
      section_title:
        type: string
      similarity:
        type: number
      tags:
        items:
          type: string
        type: array
    type: object
  skills.fileCounts:
    description: File counts for a skill
    properties:
      assets_count:
        type: integer
      references_count:
        type: integer
      scripts_count:
        type: integer
    type: object
  skills.skillCreateRequest:
    description: Request body for creating a skill
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      compatibility:
        type: string
      content:
        type: string
      description:
        type: string
      license:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  skills.skillListResponse:
    description: Paginated list of skills
    properties:
      data:
        items:
          $ref: '#/definitions/skills.skillResponse'
        type: array
      pagination:
        $ref: '#/definitions/handlers.Pagination'
    type: object
  skills.skillResponse:
    description: Skill resource representation returned by create, get, and update
      operations
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      compatibility:
        type: string
      content:
        type: string
      crc64:
        type: string
      created_at:
        type: string
      description:
        type: string
      files:
        $ref: '#/definitions/skills.fileCounts'
      id:
        type: string
      license:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
      version:
        type: string
    type: object
  skills.skillUpdateRequest:
    description: Request body for updating a skill
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      compatibility:
        type: string
      content:
        type: string
      description:
        type: string
      license:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for the Mnemonic agent-pattern-skill management service
  title: Mnemonic API
  version: "1.0"
paths:
  /agents:
    get:
      parameters:
      - description: Max results (1–200, default 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.agentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: List agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agents.agentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agents.agentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Create agent
      tags:
      - Agents
  /agents/{name}:
    delete:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Delete agent
      tags:
      - Agents
    get:
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.agentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Get agent
      tags:
      - Agents
    put:
      consumes:
      - application/json
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Agent fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agents.agentUpdateRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Update agent
      tags:
      - Agents
  /patterns:
    get:
      parameters:
      - description: Max results (1–100, default 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Comma-separated tag filter
        in: query
        name: tags
        type: string
      - description: Keyword search filter
        in: query
        name: search
        type: string
      - description: Language filter
        in: query
        name: language
        type: string
      - description: Domain filter
        in: query
        name: domain
        type: string
      - description: Entity type filter
        in: query
        name: entity_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/patterns.patternListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: List patterns
      tags:
      - Patterns
    post:
      consumes:
      - application/json
      parameters:
      - description: Pattern to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patterns.patternCreateRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/patterns.patternResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Create pattern
      tags:
      - Patterns
  /patterns/{id}:
    delete:
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Delete pattern
      tags:
      - Patterns
    get:
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/patterns.patternResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Get pattern
      tags:
      - Patterns
    put:
      consumes:
      - application/json
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      - description: Pattern fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patterns.patternUpdateRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Update pattern
      tags:
      - Patterns
  /patterns/{id}/agents:
    get:
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/patterns.associationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Get pattern agent associations
      tags:
      - Patterns
    put:
      consumes:
      - application/json
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      - description: Agent associations to set
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patterns.associationsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Set pattern agent associations
      tags:
      - Patterns
  /patterns/{id}/chunks:
    get:
      parameters:
      - description: Pattern UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/patterns.chunkListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Get pattern chunks
      tags:
      - Patterns
  /patterns/search:
    get:
      parameters:
      - description: Search query (required, max 1000 chars)
        in: query
        name: q
        required: true
        type: string
      - description: Max results (1–50, default 10)
        in: query
        name: limit
        type: integer
      - description: Similarity threshold (0–1, default 0.7)
        in: query
        name: threshold
        type: number
      - description: Comma-separated tag filter
        in: query
        name: tags
        type: string
      - description: Agent name filter
        in: query
        name: agent
        type: string
      - description: Language filter
        in: query
        name: language
        type: string
      - description: Domain filter
        in: query
        name: domain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/patterns.searchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Search patterns
      tags:
      - Patterns
  /skills:
    get:
      parameters:
      - description: Max results (1–200, default 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Comma-separated tag filter
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/skills.skillListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: List skills
      tags:
      - Skills
    post:
      consumes:
      - application/json
      parameters:
      - description: Skill to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/skills.skillCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/skills.skillResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Create a skill
      tags:
      - Skills
  /skills/{name}:
    delete:
      parameters:
      - description: Skill name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Delete a skill
      tags:
      - Skills
    get:
      parameters:
      - description: Skill name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/skills.skillResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ProblemDetail'
      summary: Get a skill by name
      tags:
      - Skills
    put:
      consumes:
      - application/json
      parameters:
      - description: Skill name
        in: path
        name: name
        required: true
        type: string
      - description: Skill fields to update
        in: body
        name: body
        required: true
