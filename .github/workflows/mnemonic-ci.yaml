name: Mnemonic CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - "src/.dockerignore"
      - ".dockerignore"
      - "Makefile"
      - "docker-compose.yaml"
      - "LICENSE"
      - ".github/workflows/mnemonic-ci.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - "src/.dockerignore"
      - ".dockerignore"
      - "Makefile"
      - "docker-compose.yaml"
      - "LICENSE"
      - ".github/workflows/mnemonic-ci.yaml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate development Compose configuration
        env:
          MNEMONIC_OPENAI_API_KEY: sk-ci-compose-validation
        run: docker compose -f ../docker-compose.yaml config --quiet

      - name: Run build script
        env:
          BUILD_COMMIT: ${{ github.sha }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: ./build/build.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            docker push ghcr.io/twistingmercury/mnemonic-api:latest
            docker push ghcr.io/twistingmercury/mnemonic-api:${VERSION}
          else
            docker tag ghcr.io/twistingmercury/mnemonic-api:latest ghcr.io/twistingmercury/mnemonic:latest-dev
            docker tag ghcr.io/twistingmercury/mnemonic-api:${VERSION} ghcr.io/twistingmercury/mnemonic:${VERSION}-dev
            docker push ghcr.io/twistingmercury/mnemonic-api:latest-dev
            docker push ghcr.io/twistingmercury/mnemonic-api:${VERSION}-dev
          fi
