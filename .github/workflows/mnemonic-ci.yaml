name: Mnemonic CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - ".dockerignore"
      - "LICENSE"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - ".dockerignore"
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run build script
        env:
          BUILD_COMMIT: ${{ github.sha }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: ./build/build.sh

      - name: Export tested image
        if: github.event_name == 'push'
        run: docker save ghcr.io/twistingmercury/mnemonic-api:sha-${{ github.sha }} --output "${RUNNER_TEMP}/mnemonic-api-image.tar"

      - name: Upload tested image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mnemonic-api-image-${{ github.sha }}
          path: ${{ runner.temp }}/mnemonic-api-image.tar
          if-no-files-found: error
          retention-days: 1
