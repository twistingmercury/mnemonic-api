name: Mnemonic CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - "src/.dockerignore"
      - ".dockerignore"
      - "Makefile"
      - "docker-compose.yaml"
      - "LICENSE"
      - ".github/workflows/mnemonic-ci.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/internal/**"
      - "src/cmd/**"
      - "src/go.mod"
      - "src/go.sum"
      - "src/build/**"
      - "src/tests/**"
      - "src/docs/**"
      - "src/.dockerignore"
      - ".dockerignore"
      - "Makefile"
      - "docker-compose.yaml"
      - "LICENSE"
      - ".github/workflows/mnemonic-ci.yaml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate development Compose configuration
        env:
          MNEMONIC_OPENAI_API_KEY: sk-ci-compose-validation
        run: docker compose -f ../docker-compose.yaml config --quiet

      - name: Run build script
        env:
          BUILD_COMMIT: ${{ github.sha }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: ./build/build.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        env:
          HEAD_SHA: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/twistingmercury/mnemonic-api
          REF_NAME: ${{ github.ref_name }}
        run: |
          source_image="${IMAGE_NAME}:sha-${HEAD_SHA}"
          docker push "${source_image}"

          if [[ "${REF_NAME}" == "main" ]]; then
            docker tag "${source_image}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"

            version_tag="$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | head -n 1)"
            if [[ -n "${version_tag}" ]]; then
              if [[ ! "${version_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
                printf 'Exact tag is not a Docker-compatible Semantic Version: %s\n' "${version_tag}" >&2
                exit 1
              fi
              docker tag "${source_image}" "${IMAGE_NAME}:${version_tag}"
              docker push "${IMAGE_NAME}:${version_tag}"
            fi
          else
            docker tag "${source_image}" "${IMAGE_NAME}:latest-dev"
            docker push "${IMAGE_NAME}:latest-dev"
          fi
