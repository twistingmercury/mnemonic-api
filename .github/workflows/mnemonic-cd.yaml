name: Mnemonic CD

on:
  workflow_run:
    workflows: ["Mnemonic CI"]
    types: [completed]
    branches: [main, develop]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: mnemonic-api-image-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/mnemonic-api-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and verify tested image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_NAME: ghcr.io/twistingmercury/mnemonic-api
        run: |
          docker load --input "${RUNNER_TEMP}/mnemonic-api-image/mnemonic-api-image.tar"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${IMAGE_NAME}:sha-${HEAD_SHA}")" = "${HEAD_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and branch promotion tags
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_NAME: ghcr.io/twistingmercury/mnemonic-api
        run: |
          source_image="${IMAGE_NAME}:sha-${HEAD_SHA}"
          docker push "${source_image}"

          if [[ "${HEAD_BRANCH}" == "main" ]]; then
            promotion_tag="latest"
          else
            promotion_tag="latest-dev"
          fi

          docker tag "${source_image}" "${IMAGE_NAME}:${promotion_tag}"
          docker push "${IMAGE_NAME}:${promotion_tag}"
